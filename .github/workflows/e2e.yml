name: E2E

on:
  push:
    branches:
      - product-version
  pull_request:
    branches:
      - product-version

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.E2E_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.E2E_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.E2E_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.E2E_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.E2E_FIREBASE_APP_ID }}
      PW_FIREBASE_ENV_MODE: e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build:e2e
        env:
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}

      - name: Write e2e service account key
        env:
          MIAMI_E2E_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.MIAMI_E2E_SERVICE_ACCOUNT_KEY_B64 }}
        run: |
          if [ -z "$MIAMI_E2E_SERVICE_ACCOUNT_KEY_B64" ]; then
            echo "Missing MIAMI_E2E_SERVICE_ACCOUNT_KEY_B64 secret"
            exit 1
          fi
          printf '%s' "$MIAMI_E2E_SERVICE_ACCOUNT_KEY_B64" | base64 --decode > serviceAccountKey.json

      - name: Run Chromium e2e tests
        timeout-minutes: 110
        env:
          CI: true
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
        run: |
          npm run seed:e2e:users
          PW_FIREBASE_ENV_MODE=e2e npx playwright test --project=chromium --max-failures=5 \
            tests/private-*.spec.js \
            tests/fixed-private-lesson-release.spec.js \
            tests/lesson-request-approval.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
